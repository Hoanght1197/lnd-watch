<title>LND Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mô hình 14/10: đơn vị = SHOP. Màn chính = bảng xếp hạng shop theo ads / traffic / sales Etsy.
   Chất liệu: gỗ ép laser trên tường phòng em bé -> nền xám xanh lá thông, nhấn xanh thông đậm. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#eaeee9; --ink:#17201b; --ink-2:#4b5650; --muted:#737e77; --line:#dbe1dc;
  --accent:#28634f; --accent-ink:#ffffff; --accent-soft:#d9eae2;
  --good:#0a8a0a; --warn:#b97c00; --serious:#c9572c; --crit:#c33232;
  --good-bg:#e1f3e1; --warn-bg:#fbf0d4; --serious-bg:#fbe5dc; --crit-bg:#f9dfdf;
  --seq:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:8px; --gut:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101412; --surface:#181d1a; --surface-2:#202723; --ink:#e7ece8; --ink-2:#b3bdb6; --muted:#87918b; --line:#2b332e;
  --accent:#6dbfa2; --accent-ink:#0b1813; --accent-soft:#1d3a30;
  --good:#3fc43f; --warn:#f2b632; --serious:#ec835a; --crit:#ef6b6b;
  --good-bg:#16301a; --warn-bg:#352a10; --serious-bg:#3a2117; --crit-bg:#3a1a1a;
  --seq:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181d1a; --surface-2:#202723; --ink:#e7ece8; --ink-2:#b3bdb6; --muted:#87918b; --line:#2b332e;
  --accent:#6dbfa2; --accent-ink:#0b1813; --accent-soft:#1d3a30;
  --good:#3fc43f; --warn:#f2b632; --serious:#ec835a; --crit:#ef6b6b;
  --good-bg:#16301a; --warn-bg:#352a10; --serious-bg:#3a2117; --crit-bg:#3a1a1a;
  --seq:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em;display:block}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav a small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.mode{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);width:max-content}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.mode.live i{background:var(--good)}

main{padding-inline:clamp(16px,3vw,32px);padding-block:24px 64px;min-width:0;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph h1{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink-2);max-width:72ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-size:17px;margin:0;letter-spacing:-.005em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in oklab,var(--warn) 40%,transparent);font-size:13px}
.banner.err{background:var(--crit-bg);border-color:color-mix(in oklab,var(--crit) 40%,transparent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .s{font-size:11px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;min-width:0}
.filters input[type=search]{width:200px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[aria-sort]{color:var(--ink)}
th.sort[aria-sort="descending"]::after{content:" ↓"}
th.sort[aria-sort="ascending"]::after{content:" ↑"}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th.n,td.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.sticky,th.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
tr.click:hover td.sticky{background:var(--surface-2)}
td.rk{font-family:var(--f-mono);font-size:11px;color:var(--muted);width:28px}
.shopcell{display:flex;align-items:center;gap:8px;min-width:0}
.shopcell .nm{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.shopcell .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.shopcell .nm small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:200px}
.plat{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;flex:none}
.plat.etsy{background:var(--serious-bg);color:var(--serious)}
.big{font-family:var(--f-display);font-weight:700;font-size:16px}
.sub{display:block;font-size:11px;color:var(--muted)}
.dim{color:var(--muted)}
.up{color:var(--good)} .down{color:var(--crit)}
.chg{border-radius:4px;padding:1px 5px;font-variant-numeric:tabular-nums}
.chg.up{background:var(--good-bg)} .chg.down{background:var(--crit-bg)}
.spark{display:block}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.serious{background:var(--serious-bg);color:var(--serious)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}

.feed{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.al:last-child{border-bottom:0}
.al:hover{background:var(--surface-2)}
.al .t{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al .d{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--bg)}

.chart{position:relative;height:280px}
.chart.sm{height:200px}
.label-true{font-size:11px;font-weight:600;color:var(--good);background:var(--good-bg);padding:2px 8px;border-radius:99px}

/* Panel chi tiết shop */
.modal{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .5);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;width:min(920px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.adgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ad{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--bg)}
.ad .top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.ad .txt{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.ad .lk{display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0}
.ad .lk a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cty{display:flex;flex-direction:column;gap:6px}
.cty .r{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:12px}
.cty .bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cty .bar i{display:block;height:100%;background:var(--s1);border-radius:4px}

#tip{position:fixed;z-index:50;pointer-events:none;max-width:300px;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;box-shadow:0 4px 14px rgb(0 0 0 / .2);opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
[data-tip]{cursor:help}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}
  .brand span,.side-foot{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none;min-width:0}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav a small{display:none}
  .filters input[type=search]{flex:1 1 100%;width:100%}
  td.sticky,th.sticky{position:static}
  .ph h1{font-size:23px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .al{grid-template-columns:minmax(0,1fr) auto}
  .shopcell .nm b,.shopcell .nm small{max-width:130px}
  td.sticky .plat,td.rk,th.rk{display:none}
  .al .pillc{grid-column:1 / -1}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><b>LND Watch</b><span>Đối thủ bảng tên gỗ trẻ em</span></div>
    <nav class="nav" id="nav" aria-label="Màn hình"></nav>
    <div class="side-foot">
      <span class="mode live" id="mode"><i></i><span>Dữ liệu trực tiếp</span></span>
      <span id="upd">Đang tải…</span>
      <span>Chỉ số đếm được. Traffic là số ước của SimilarWeb.</span>
    </div>
  </aside>
  <main id="main" aria-live="polite"><div class="empty"><b>Đang tải dữ liệu…</b></div></main>
</div>
<div id="tip" role="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ===== Cấu hình (đổi được) ===== */
const RAW_BASE = "https://raw.githubusercontent.com/Hoanght1197/lnd-watch/main/data/";

window.__errs = [];
window.addEventListener("error", e => { if (e.message) window.__errs.push(e.message + " @" + (e.lineno || "")); });
window.addEventListener("unhandledrejection", e => window.__errs.push("promise: " + (e.reason && e.reason.message || e.reason)));

/* ===== Tiện ích ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("vi-VN");
const isNum = v => v != null && !isNaN(v);
const fmtN = v => isNum(v) ? nf.format(v) : "—";
const fmtK = v => !isNum(v) ? "—" : v >= 1e6 ? (v / 1e6).toFixed(1).replace(".0", "") + "M" : v >= 1e4 ? Math.round(v / 1e3) + "K" : v >= 1e3 ? (v / 1e3).toFixed(1).replace(".0", "") + "K" : String(v);
const fmtUSD = v => isNum(v) ? "$" + (Number(v) % 1 ? Number(v).toFixed(2) : Number(v)) : "—";
const fmtSigned = v => isNum(v) ? (v > 0 ? "+" : "") + nf.format(v) : "—";
const fmtPct = v => isNum(v) ? (v > 0 ? "+" : "") + Number(v).toFixed(1).replace(".0", "") + "%" : "—";
const fmtD = iso => { if (!iso) return "—"; const m = String(iso).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}` : "—"; };
const fmtM = ym => { const m = String(ym || "").match(/(\d{4})-(\d{2})/); return m ? `T${+m[2]}/${m[1]}` : "—"; };
const fmtDT = iso => { if (!iso) return "—"; if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return fmtD(iso); const t = new Date(iso); if (isNaN(t)) return fmtD(iso);
  const v = new Date(t.getTime() + 7 * 3600e3); const p = n => String(n).padStart(2, "0");
  return `${p(v.getUTCDate())}/${p(v.getUTCMonth() + 1)} ${p(v.getUTCHours())}:${p(v.getUTCMinutes())}`; };
const tipAttr = (src, at, extra) => `data-tip="${esc(`${extra ? extra + " · " : ""}Nguồn: ${src || "?"} · quét: ${fmtDT(at)} (giờ VN)`)}" tabindex="0"`;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LS = { get(k, d) { try { const v = localStorage.getItem("lndw2." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem("lndw2." + k, JSON.stringify(v)); } catch {} } };
const PALETTE = ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"];

/* ===== Tải dữ liệu ===== */
const S = { lb: null, alerts: [], errors: [] };
async function getJSON(path) {
  try {
    const r = await fetch(RAW_BASE + path + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
    if (!r.ok) { S.errors.push(`${path}: HTTP ${r.status}`); return null; }
    return await r.json();
  } catch (e) { S.errors.push(`${path}: ${e.message}`); return null; }
}
async function loadAll() {
  const [lb, al] = await Promise.all([getJSON("leaderboard.json"), getJSON("alerts.json")]);
  S.lb = lb; S.alerts = Array.isArray(al) ? al : [];
}
const ROWS = () => (S.lb && S.lb.rows) || [];
const SRC = k => (S.lb && S.lb.sources && S.lb.sources[k]) || k;

/* ===== CSV (link blob: đây là GitHub Pages) ===== */
function saveCSV(name, header, rows) {
  const q = v => { v = v == null ? "" : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = "﻿" + [header, ...rows].map(r => r.map(q).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${name}_${(S.lb && S.lb.latest_date) || "data"}.csv`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===== Sparkline ===== */
function spark(vals, color, w = 90, h = 26) {
  const pts0 = vals.map((v, i) => [i, v]).filter(p => isNum(p[1]));
  if (pts0.length < 2) return `<span class="dim" data-tip="Cần ≥ 2 ngày dữ liệu để vẽ" tabindex="0">${pts0.length ? "1 ngày" : "—"}</span>`;
  const ys = pts0.map(p => p[1]); const mn = Math.min(...ys), mx = Math.max(...ys), rg = mx - mn || 1; const n = vals.length - 1 || 1;
  const pts = pts0.map(([i, v]) => [2 + i * (w - 6) / n, h - 3 - (v - mn) / rg * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/></svg>`;
}

/* ===== Charts ===== */
const CHARTS = [];
function destroyCharts() { while (CHARTS.length) { try { CHARTS.pop().destroy(); } catch {} } }
function chartBase() {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { position: "bottom", labels: { color: cssv("--ink-2"), usePointStyle: true, pointStyle: "rectRounded", boxWidth: 10, boxHeight: 10, font: { family: cssv("--f-body") } } },
      tooltip: { backgroundColor: cssv("--ink"), titleColor: cssv("--bg"), bodyColor: cssv("--bg"), padding: 9, cornerRadius: 6, boxPadding: 4, usePointStyle: true } },
    scales: {
      x: { grid: { display: false }, ticks: { color: cssv("--muted"), font: { family: cssv("--f-mono"), size: 10 } }, border: { color: cssv("--line") } },
      y: { grid: { color: cssv("--line") }, border: { display: false }, ticks: { color: cssv("--muted"), font: { family: cssv("--f-mono"), size: 10 } }, beginAtZero: true }
    }
  };
}
function mkChart(canvas, cfg) {
  if (!canvas) return;
  if (!window.Chart) { canvas.parentElement.innerHTML = `<div class="empty"><b>Không tải được thư viện biểu đồ</b>Số liệu vẫn có trong bảng.</div>`; return; }
  const c = new Chart(canvas, cfg); CHARTS.push(c); return c;
}

}
const MC = [];
function destroyModalCharts() { while (MC.length) { const c = MC.pop(); try { c && c.destroy(); } catch {} } }

/* ===== 2. Cảnh báo ===== */
const ALERT_T = { ads_jump: ["Ads tăng mạnh", "serious"], ads_new_shop: ["Bắt đầu chạy ads", "info"], traffic_jump: ["Traffic tăng", "good"],
  etsy_sales_spike: ["Sales Etsy tăng vọt", "good"], new_shop: ["Shop mới", "warn"] };
const AF = Object.assign({ type: "all" }, LS.get("alerts", {}));
function vAlerts() {
  const cnt = {}; S.alerts.forEach(a => cnt[a.type] = (cnt[a.type] || 0) + 1);
  add(`<div class="ph"><div><div class="eyebrow">90 ngày gần nhất</div><h1>Cảnh báo</h1>
    <p>Ads tăng ≥ 50% hoặc +20 · shop bắt đầu chạy ads · traffic tháng tăng ≥ 30% · sales Etsy/ngày > 2× trung bình 14 ngày · shop mới vào danh sách.</p></div></div>
  <section class="panel"><div class="panel-h"><div class="chips" role="group" aria-label="Loại cảnh báo">
    <button class="chip" type="button" data-at="all" aria-pressed="${AF.type === "all"}">Tất cả<b>${S.alerts.length}</b></button>
    ${Object.entries(ALERT_T).map(([k, [l]]) => `<button class="chip" type="button" data-at="${k}" aria-pressed="${AF.type === k}">${l}<b>${cnt[k] || 0}</b></button>`).join("")}
  </div></div><div class="feed" id="feed"></div></section>`);
  drawFeed();
}
function drawFeed() {
  document.querySelectorAll("[data-at]").forEach(b => b.setAttribute("aria-pressed", b.dataset.at === AF.type));
  const L = S.alerts.filter(a => AF.type === "all" || a.type === AF.type);
  $("#feed").innerHTML = L.map(a => { const [l, c] = ALERT_T[a.type] || [a.type, "info"];
    const inner = `<span class="pillc"><span class="pill ${c}">${l}</span></span><span style="min-width:0"><span class="t" style="display:block">${esc(a.title)}</span><span class="m" style="display:block">${esc(a.detail || "")}</span></span><span class="d">${fmtD(a.date)}</span>`;
    return a.url ? `<a class="al" href="${esc(a.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="al">${inner}</div>`; }).join("")
    || `<div class="empty"><b>Chưa có cảnh báo</b>Cảnh báo cần ít nhất 2 ngày dữ liệu để so sánh (trừ traffic tăng). Bộ thu chạy mỗi sáng 6h.</div>`;
}

/* ===== 3. Sales Etsy ===== */
function vSales() {
  const et = ROWS().filter(r => r.platform === "etsy");
  const dates = S.lb.dates || [];
  const mode = LS.get("salesMode", "daily");
  const rows = et.slice().sort((a, b) => (b.etsy_sales_7d ?? -1) - (a.etsy_sales_7d ?? -1) || (b.etsy_sales ?? 0) - (a.etsy_sales ?? 0));
  add(`<div class="ph"><div><div class="eyebrow">${et.length} shop Etsy · <span class="label-true">số thật từ Etsy</span></div><h1>Sales Etsy theo ngày</h1>
    <p>Etsy hiện tổng số đơn đã bán của shop; chênh lệch giữa 2 lần quét = số đơn mới. Không phải doanh thu.</p></div>
    <div class="seg" role="group" aria-label="Kiểu biểu đồ"><button type="button" data-sm="daily" aria-pressed="${mode === "daily"}">Sales/ngày</button><button type="button" data-sm="total" aria-pressed="${mode === "total"}">Tổng sales</button></div></div>
  <section class="panel"><div class="panel-h"><h2>${mode === "daily" ? "Sales mỗi ngày" : "Tổng sales"} · 8 shop bán nhiều nhất</h2></div><div class="panel-b">
    <div class="chart"><canvas id="cS" aria-label="Biểu đồ sales Etsy"></canvas></div>
    ${dates.length < 2 ? '<div class="note">Mới có 1 ngày dữ liệu: sales/ngày cần ≥ 2 lần quét.</div>' : ""}</div></section>
  <section class="panel"><div class="panel-h"><h2>Xếp hạng theo sales 7 ngày</h2><button class="btn" type="button" id="csvE">Tải CSV</button></div>
    <div class="tw"><table><thead><tr><th>#</th><th class="sticky">Shop</th><th class="n">Sales 7d</th><th class="n">Hôm qua</th><th class="n">Tổng sales</th><th class="n">Review</th><th class="n">Rating</th><th class="n">Admirers</th><th class="n">Listing</th><th>Ở đâu</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr class="click" data-shop="${esc(r.id)}" tabindex="0"><td class="rk">${i + 1}</td><td class="sticky"><div class="shopcell"><span class="nm"><b>${esc(r.name)}</b></span></div></td>
      <td class="n" ${tipAttr(SRC("etsy"), r.updated.etsy)}>${isNum(r.etsy_sales_7d) ? `<span class="big">${fmtSigned(r.etsy_sales_7d)}</span>` : '<span class="dim">cần thêm ngày</span>'}</td>
      <td class="n">${fmtSigned(r.etsy_sales_1d)}</td><td class="n">${fmtN(r.etsy_sales)}</td><td class="n">${fmtN(r.etsy_reviews)}</td><td class="n">${r.etsy_rating ?? "—"}</td>
      <td class="n">${fmtN(r.etsy_admirers)}</td><td class="n">${fmtN(r.etsy_listings)}</td><td class="dim">${esc(r.etsy_location || "")}</td></tr>`).join("")}</tbody></table></div></section>`);
  const top = rows.slice().sort((a, b) => (b.etsy_sales ?? 0) - (a.etsy_sales ?? 0)).slice(0, 8);
  const cfg = chartBase(); cfg.scales.y.beginAtZero = mode === "daily";
  mkChart($("#cS"), { type: "line", data: { labels: dates.map(fmtD), datasets: top.map((r, i) => { const s = r.series_etsy_sales || [];
    const vals = mode === "daily" ? s.map((v, j) => j && isNum(v) && isNum(s[j - 1]) ? v - s[j - 1] : null) : s;
    const c = cssv(PALETTE[i % 8]); return { label: r.name, data: vals, borderColor: c, backgroundColor: c, borderWidth: 2, pointRadius: 3, tension: .25, spanGaps: true }; }) }, options: cfg });
  $("#csvE").addEventListener("click", () => saveCSV("sales_etsy", ["hang", "shop", "sales_7d", "sales_hom_qua", "tong_sales", "review", "rating", "admirers", "listing", "o_dau", "link", "cap_nhat"],
    rows.map((r, i) => [i + 1, r.name, r.etsy_sales_7d, r.etsy_sales_1d, r.etsy_sales, r.etsy_reviews, r.etsy_rating, r.etsy_admirers, r.etsy_listings, r.etsy_location, r.link, r.updated.etsy])));
}

/* ===== Tương tác chung ===== */
const tip = $("#tip");
function showTip(el) { const t = el.getAttribute("data-tip"); if (!t) return; tip.textContent = t; tip.classList.add("on");
  const r = el.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8); let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  tip.style.left = x + "px"; tip.style.top = y + "px"; }
const hideTip = () => tip.classList.remove("on");
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); el ? showTip(el) : hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); el ? showTip(el) : hideTip(); });
addEventListener("scroll", hideTip, { passive: true });
document.addEventListener("click", e => {
  const p = e.target.closest("[data-plat]"); if (p) { F.plat = p.dataset.plat; saveF(); drawBoard(); return; }
  const th = e.target.closest("th.sort"); if (th) { if (F.sort === th.dataset.sort) F.dir = -F.dir; else { F.sort = th.dataset.sort; F.dir = -1; } saveF(); drawBoard(); return; }
  const at = e.target.closest("[data-at]"); if (at) { AF.type = at.dataset.at; LS.set("alerts", AF); drawFeed(); return; }
  const sm = e.target.closest("[data-sm]"); if (sm) { LS.set("salesMode", sm.dataset.sm); render(); return; }
  const tr = e.target.closest("tr[data-shop]"); if (tr && !e.target.closest("a")) { openShop(tr.dataset.shop); return; }
  const tp = e.target.closest("[data-tip]"); if (tp && matchMedia("(hover: none)").matches) showTip(tp);
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const tr = e.target.closest?.("tr[data-shop]"); if (tr) openShop(tr.dataset.shop); } });
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
let rerenderT; const rerender = () => { clearTimeout(rerenderT); rerenderT = setTimeout(() => { if (CHARTS.length) render(); }, 60); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

(async function boot() {
  await loadAll();
  $("#upd").textContent = S.lb ? "Cập nhật " + fmtDT(S.lb.updated_at) + " (giờ VN)" : "Chưa có dữ liệu";
  render();
})();
</script>
