<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>LND Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar trái (7 màn hình) + vùng làm việc dày số; mobile: thanh tab ngang dính trên đầu.
   Chất liệu: gỗ ép laser trên tường phòng em bé -> nền xám xanh lá thông, nhấn xanh thông đậm, ảnh sản phẩm là điểm sáng. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#eaeee9; --ink:#17201b; --ink-2:#4b5650; --muted:#737e77; --line:#dbe1dc;
  --accent:#28634f; --accent-ink:#ffffff; --accent-soft:#d9eae2;
  --good:#0a8a0a; --warn:#b97c00; --serious:#c9572c; --crit:#c33232;
  --good-bg:#e1f3e1; --warn-bg:#fbf0d4; --serious-bg:#fbe5dc; --crit-bg:#f9dfdf;
  --seq:#2a78d6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:8px; --gut:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101412; --surface:#181d1a; --surface-2:#202723; --ink:#e7ece8; --ink-2:#b3bdb6; --muted:#87918b; --line:#2b332e;
  --accent:#6dbfa2; --accent-ink:#0b1813; --accent-soft:#1d3a30;
  --good:#3fc43f; --warn:#f2b632; --serious:#ec835a; --crit:#ef6b6b;
  --good-bg:#16301a; --warn-bg:#352a10; --serious-bg:#3a2117; --crit-bg:#3a1a1a;
  --seq:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181d1a; --surface-2:#202723; --ink:#e7ece8; --ink-2:#b3bdb6; --muted:#87918b; --line:#2b332e;
  --accent:#6dbfa2; --accent-ink:#0b1813; --accent-soft:#1d3a30;
  --good:#3fc43f; --warn:#f2b632; --serious:#ec835a; --crit:#ef6b6b;
  --good-bg:#16301a; --warn-bg:#352a10; --serious-bg:#3a2117; --crit-bg:#3a1a1a;
  --seq:#3987e5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{padding:0 8px}
.brand b{font-family:var(--f-display);font-size:22px;letter-spacing:-.01em;display:block}
.brand span{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav a small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.mode{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);width:max-content}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.mode.live i{background:var(--good)}

main{padding-inline:clamp(16px,3vw,32px);padding-block:24px 64px;min-width:0;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.ph h1{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink-2);max-width:68ch}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-family:var(--f-display);font-size:17px;margin:0;letter-spacing:-.005em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px}
.note{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in oklab,var(--warn) 40%,transparent);font-size:13px}
.banner.err{background:var(--crit-bg);border-color:color-mix(in oklab,var(--crit) 40%,transparent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink-2);margin-bottom:4px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .s{font-size:11px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);font-weight:500}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13px;min-width:0}
.filters input[type=number]{width:84px}
.filters input[type=search]{width:180px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th.n,td.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.sticky,th.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
tr.click:hover td.sticky{background:var(--surface-2)}
.shopcell{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.plat{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.dim{color:var(--muted)}
.up{color:var(--good)} .down{color:var(--crit)}
.chg{border-radius:4px;padding:1px 4px}
.chg.up{background:var(--good-bg)} .chg.down{background:var(--crit-bg)}
.spark{display:block}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.serious{background:var(--serious-bg);color:var(--serious)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}

.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.feed{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.al:last-child{border-bottom:0}
.al:hover{background:var(--surface-2)}
.al .th{width:44px;height:44px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.al .th img{width:100%;height:100%;object-fit:cover}
.al .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.al .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.al .d{color:var(--ink);font-weight:500;font-size:12px}

.chart{position:relative;height:300px}
.chart.sm{height:220px}
.label-true{font-size:11px;font-weight:600;color:var(--good);background:var(--good-bg);padding:2px 8px;border-radius:99px}

/* Lưới design */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip b{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:8px;min-width:0}
.card .im{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:block}
.card .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card a.im:hover img{transform:scale(1.03)}
.ph-img{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--ink-2);font-family:var(--f-display);font-size:15px;
  background:repeating-linear-gradient(115deg,var(--surface-2) 0 10px,color-mix(in oklab,var(--surface-2) 70%,var(--line)) 10px 11px)}
.ph-img small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-top:6px}
.badges{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.bd{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:color-mix(in oklab,var(--surface) 92%,transparent);color:var(--ink);font-variant-numeric:tabular-nums;box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.bd.rk{background:var(--ink);color:var(--bg)}
.bd.bs{background:var(--warn);color:#1e1600}
.card .ti{font-size:13px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.card .pr{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .row .shopcell{min-width:0;gap:5px}
.card .row .shopcell span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .tags{display:flex;flex-wrap:wrap;gap:4px}
.card.mine .im{outline:2px solid var(--accent);outline-offset:-2px}
.mine-strip{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:12px;overflow-x:auto;padding-bottom:4px}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.pager button{min-width:34px}
.pager button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Ads */
.adgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ad{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ad .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ad .days{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.ad .days small{display:block;font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted)}
.ad .txt{font-size:13px;color:var(--ink-2)}
.ad .dest{display:flex;gap:8px;align-items:center;font-size:12px;min-width:0}
.ad .dest img,.ad .dest .ph{width:40px;height:40px;border-radius:5px;object-fit:cover;background:var(--surface-2);flex:none}
.ad .dest span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{margin:6px 0 0;font-size:13px;display:flex;align-items:center;gap:8px}

/* Mùa vụ heatmap */
.hm{border-collapse:separate;border-spacing:3px;width:auto}
.hm th{font-family:var(--f-mono);font-size:10px;text-transform:none;letter-spacing:0;padding:2px;border:0;text-align:center}
.hm th.sh{text-align:left;padding-right:10px;font-family:var(--f-body);font-size:12px;color:var(--ink-2);font-weight:500}
.hm td{padding:0;border:0;width:30px;height:30px;border-radius:4px;text-align:center;font-family:var(--f-mono);font-size:10px;color:var(--ink);position:relative}
.hm td.z{background:var(--surface-2);color:transparent}
.hm td .sz{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 1.5px var(--surface)}
.hm th.xmas{background:color-mix(in oklab,var(--crit) 18%,transparent);border-radius:4px;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Tooltip + modal */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:280px;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;box-shadow:0 4px 14px rgb(0 0 0 / .2);opacity:0;transition:opacity .1s}
#tip.on{opacity:1}
[data-tip]{cursor:help}
.modal{position:fixed;inset:0;z-index:40;background:rgb(0 0 0 / .5);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;width:min(880px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}

@media (max-width:1440px){ .ov{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}
  .brand span,.side-foot{display:none}
  .brand b{font-size:17px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none;min-width:0}
  .nav a{white-space:nowrap;padding:6px 10px}
  .nav a small{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .filters input[type=search]{width:100%}
  .filters label.wide{flex:1 1 100%}
  td.sticky,th.sticky{position:static}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><b>LND Watch</b><span>Đối thủ bảng tên gỗ trẻ em</span></div>
    <nav class="nav" id="nav" aria-label="Màn hình"></nav>
    <div class="side-foot">
      <span class="mode" id="mode"><i></i><span>…</span></span>
      <span id="upd">Đang tải…</span>
      <span>Chỉ số đếm được. Không ước tính doanh thu.</span>
    </div>
  </aside>
  <main id="main" aria-live="polite"><div class="empty"><b>Đang tải dữ liệu…</b></div></main>
</div>
<div id="tip" role="tooltip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* ===== Cấu hình (đổi được) ===== */
const RAW_BASE = "data/";
const DATA_MODE = "remote"; // "remote" | "sample"

window.__errs = [];
window.addEventListener("error", e => { if (e.message) window.__errs.push(e.message + " @" + (e.lineno || "")); });
window.addEventListener("unhandledrejection", e => window.__errs.push("promise: " + (e.reason && e.reason.message || e.reason)));

/* ===== Tiện ích ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = new Intl.NumberFormat("vi-VN");
const fmtN = v => v == null || isNaN(v) ? "—" : nf.format(v);
const fmtUSD = v => v == null || isNaN(v) ? "—" : "$" + Number(v).toFixed(2);
const fmtSigned = v => v == null || isNaN(v) ? "—" : (v > 0 ? "+" : "") + nf.format(v);
const fmtD = iso => { if (!iso) return "—"; const m = String(iso).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}` : "—"; };
const fmtDT = iso => { if (!iso) return "—"; const t = new Date(iso); if (isNaN(t)) return fmtD(iso);
  const v = new Date(t.getTime() + 7 * 3600e3); const p = n => String(n).padStart(2, "0");
  return `${p(v.getUTCDate())}/${p(v.getUTCMonth() + 1)} ${p(v.getUTCHours())}:${p(v.getUTCMinutes())}`; };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
const addDays = (iso, n) => { const t = new Date(iso + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
const median = xs => { xs = xs.filter(x => x != null && !isNaN(x)).sort((a, b) => a - b); if (!xs.length) return null; const n = xs.length; return n % 2 ? xs[(n - 1) / 2] : (xs[n / 2 - 1] + xs[n / 2]) / 2; };
const tipAttr = (src, at) => `data-tip="${esc(`Nguồn: ${src || "?"} · quét: ${fmtDT(at)}`)}" tabindex="0"`;
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const LS = { get(k, d) { try { const v = localStorage.getItem("lndw." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem("lndw." + k, JSON.stringify(v)); } catch {} } };

/* ===== Tải dữ liệu ===== */
const S = { idx: null, shop: {}, etsy: {}, ads: {}, alerts: [], themes: null, mine: null, missing: [], errors: [], today: null };
function loadScript(src) { return new Promise(res => { const s = document.createElement("script"); s.src = src; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); }); }
async function getJSON(path) {
  try {
    if (DATA_MODE === "sample") {
      const v = (window.SAMPLE_DATA || {})[path];
      if (v === undefined) { S.missing.push(path); return null; }
      return v;
    }
    const r = await fetch(RAW_BASE + path + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
    if (!r.ok) { S.missing.push(path + " (" + r.status + ")"); return null; }
    return await r.json();
  } catch (e) { S.errors.push(path + ": " + (e.message || e)); return null; }
}
async function loadAll() {
  if (DATA_MODE === "sample" && !window.SAMPLE_DATA) {
    const ok = await loadScript("sample-data.js");
    if (!ok) S.errors.push("không tải được sample-data.js");
  }
  S.idx = await getJSON("index.json");
  if (!S.idx) return;
  const idx = S.idx;
  const jobs = [];
  (idx.shopify || []).forEach(s => jobs.push(getJSON(`shopify/${s.domain}/summary.json`).then(v => { if (v) S.shop[s.domain] = v; })));
  (idx.etsy || []).forEach(s => jobs.push(getJSON(`etsy/${s.shop}/summary.json`).then(v => { if (v) S.etsy[s.shop] = v; })));
  (idx.ads || []).forEach(s => jobs.push(getJSON(`ads/${s.key}/summary.json`).then(v => { if (v) S.ads[s.key] = v; })));
  jobs.push(getJSON("alerts.json").then(v => { S.alerts = Array.isArray(v) ? v : []; }));
  jobs.push(getJSON("themes.json").then(v => { S.themes = v; }));
  jobs.push(getJSON("mine.json").then(v => { S.mine = v; }));
  await Promise.all(jobs);
  S.missing = S.missing.filter(p => !p.startsWith("mine.json")); // mine.json là tuỳ chọn
  S.today = (idx.dates && idx.dates[idx.dates.length - 1]) || (idx.updated_at || "").slice(0, 10) || new Date().toISOString().slice(0, 10);
}

  (idx.shopify || []).forEach(s => list.push({ key: s.domain, plat: "shopify", name: s.name || s.domain, meta: s }));
  (idx.etsy || []).forEach(s => list.push({ key: s.shop, plat: "etsy", name: s.shop, meta: s }));
  list.forEach((s, i) => s.color = i < 8 ? `var(--s${i + 1})` : "var(--muted)");
  list.forEach((s, i) => s.ci = i);
  SHOPS = list;
  EXTRA_COLOR = {}; let k = list.length;
  (idx.ads || []).forEach(a => { if (!list.some(s => s.key === a.key)) { EXTRA_COLOR[a.key] = k < 8 ? `var(--s${k + 1})` : "var(--muted)"; k++; } });
}
let EXTRA_COLOR = {};
const shopOf = key => SHOPS.find(s => s.key === key);
const colorOf = key => (shopOf(key) || {}).color || EXTRA_COLOR[key] || "var(--muted)";
const resolveColor = c => c.startsWith("var(") ? cssv(c.slice(4, -1)) : c;
function seriesAt(series, date) { // bản ghi gần nhất có ngày <= date
  if (!series || !series.length) return null; let best = null;
  for (const r of series) if (r.date <= date && (!best || r.date > best.date)) best = r;
  return best;
}

/* ===== CSV ===== */
let dlNS; // namespace downloads của viewer (nếu có)
async function saveCSV(name, header, rows) {
  const q = v => { v = v == null ? "" : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const csv = "﻿" + [header, ...rows].map(r => r.map(q).join(",")).join("\n");
  const filename = `${name}_${S.today || "data"}.csv`;
  try {
    if (dlNS === undefined && window.claude && window.claude.use) dlNS = await window.claude.use("downloads");
    if (dlNS) { await dlNS.save({ filename, data: new Blob([csv], { type: "text/csv" }) }); return; }
  } catch (e) { if (e && e.code === "declined") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===== Sparkline ===== */
function spark(vals, color, w = 84, h = 24) {
  vals = vals.filter(v => v != null && !isNaN(v));
  if (vals.length < 2) return `<span class="dim">—</span>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [2 + i * (w - 6) / (vals.length - 1), h - 3 - (v - mn) / rg * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)} ${h} L2 ${h}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/></svg>`;
}

    <tbody>${etsyRows.map(r => `<tr><td class="sticky"><div class="shopcell"><span class="dot" style="background:${r.s.color}"></span><b>${esc(r.s.key)}</b></div></td><td class="n">${r.n}</td>
      <td class="n" ${tipAttr(r.sm.source, r.sm.updated_at)}>${fmtUSD(r.med)}</td><td class="n" ${tipAttr(r.sm.source, r.sm.updated_at)}>${r.min < 1e9 ? fmtUSD(r.min) : "—"}</td></tr>`).join("")}</tbody></table></div></div>` : ""}`);
  if (!rows.length) return;
  CSV.price = () => saveCSV("gia_theo_size", ["shop", ...cols.map(c => c + "in"), ...cols.map(c => c + "in_7d_truoc"), "usd_per_in_12", "usd_per_in_24"],
    rows.map(r => [r.s.key, ...cols.map(c => r.pbs[c]), ...cols.map(c => r.old[c]), r.pbs["12"] ? (r.pbs["12"] / 12).toFixed(2) : "", r.pbs["24"] ? (r.pbs["24"] / 24).toFixed(2) : ""]));
  const cfg = chartBase(); cfg.interaction = { mode: "nearest", intersect: false };
  cfg.scales.x = { ...cfg.scales.x, type: "linear", min: 6, max: 32, ticks: { ...cfg.scales.x.ticks, stepSize: 2, callback: v => v + "in" } };
  cfg.scales.y.ticks.callback = v => "$" + v; cfg.scales.y.beginAtZero = true;
  cfg.plugins.tooltip.callbacks = { title: c => c[0].parsed.x + " in", label: c => ` ${c.dataset.label}: ${fmtUSD(c.parsed.y)}` };
  mkChart($("#priceChart"), { type: "line", data: { datasets: rows.map(r => { const c = resolveColor(r.s.color);
    return { label: r.s.name, data: Object.entries(r.pbs).map(([k, v]) => ({ x: +k, y: v })).sort((a, b) => a.x - b.x), borderColor: c, backgroundColor: c, borderWidth: 2, pointRadius: 4, pointHoverRadius: 6, pointBorderColor: cssv("--surface"), pointBorderWidth: 2 }; }) }, options: cfg });

/* ===== 5. Ads board ===== */
let AF = Object.assign({ win: "all", long: false, group: "shop" }, LS.get("af", {}));
function vAds(main) {
  const T = S.today;
  const all = Object.entries(S.ads).flatMap(([key, sm]) => (sm.ads || []).map(a => {
    const prod = (S.shop[key]?.products || []).find(p => p.handle && p.handle === a.product_handle);
    return { ...a, key, sm, prod, theme: a.theme || prod?.theme || "khac" }; }));
  section(`
  <div class="ph"><div><div class="eyebrow">Màn hình 5</div><h1>Ads board</h1>
    <p>Quảng cáo Facebook/Instagram từ Meta Ad Library. Ad chạy quá 14 ngày thường là ad có lời, đáng xem kỹ.</p></div>${csvBtn("ads")}</div>
  ${all.length ? `
  <div class="filters">

  if (!all.length) return;

    vis().map(a => [a.key, a.library_id, a.first_seen, a.last_seen, a.days_running, a.active ? 1 : 0, a.theme, a.text, a.landing, (a.platforms || []).join("|")]));
  const draw = () => {
    const L = vis(); $("#adCount").textContent = `${L.length} ad`;

    $("#adBoard").innerHTML = L.length ? Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([g, arr]) => `<section class="grp">
      <h3>${AF.group === "shop" ? `<span class="dot" style="background:${colorOf(g)}"></span>${esc(g)}` : esc(tv(THEME_VI, g))}<span class="note">${arr.length} ad</span></h3>
      <div class="adgrid">${arr.map(a => { const long = a.days_running > 14;
        return `<article class="ad"><div class="top"><div style="display:flex;flex-direction:column;gap:4px">
          <div style="display:flex;gap:4px;flex-wrap:wrap">${a.active ? '<span class="pill good">● Đang chạy</span>' : '<span class="pill">Đã dừng</span>'}${long ? '<span class="pill serious">▲ &gt; 14 ngày</span>' : ""}</div>
          <span class="note">Bắt đầu ${fmtD(a.first_seen)} · thấy lần cuối ${fmtD(a.last_seen)}</span></div>

          <div class="txt">${esc(a.text || "(không có chữ)")}</div>
          <a class="dest" href="${esc(a.landing || "#")}" target="_blank" rel="noopener">${a.prod?.image ? `<img loading="lazy" src="${esc(a.prod.image)}" alt="">` : '<span class="ph"></span>'}
            <span>${esc(a.prod?.title || a.product_handle || a.landing || "—")}</span></a>
          <div class="note">${esc((a.platforms || []).join(" · "))} · ID ${esc(a.library_id)}${AF.group === "theme" ? " · " + esc(a.key) : ""}</div></article>`; }).join("")}</div></section>`).join("")
      : `<div class="panel"><div class="empty"><b>Không có ad nào khớp</b>Thử khoảng ngày rộng hơn hoặc tắt “Chạy &gt; 14 ngày”.</div></div>`;
  };
  document.querySelectorAll("[data-win]").forEach(b => b.onclick = () => { AF.win = b.dataset.win; LS.set("af", AF); document.querySelectorAll("[data-win]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  document.querySelectorAll("[data-grp]").forEach(b => b.onclick = () => { AF.group = b.dataset.grp; LS.set("af", AF); document.querySelectorAll("[data-grp]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
  $("#aLong").onclick = () => { AF.long = !AF.long; LS.set("af", AF); $("#aLong").setAttribute("aria-pressed", AF.long); draw(); };

/* ===== 6. Review ===== */
function vReview(main) {
  const shops = SHOPS.filter(s => s.plat === "etsy" && S.etsy[s.key]);
  const top = Object.entries(S.etsy).flatMap(([shop, sm]) => (sm.listings || []).map(l => ({ ...l, shop, sm }))).filter(l => l.reviews_7d != null)
    .sort((a, b) => b.reviews_7d - a.reviews_7d).slice(0, 15);
  section(`
  <div class="ph"><div><div class="eyebrow">Màn hình 6 · bản đầu</div><h1>Review</h1>
    <p>Số review mới mỗi ngày của từng shop Etsy, lấy từ tổng review công khai. Nội dung review sẽ bổ sung ở bản sau.</p></div></div>
  ${shops.length ? `<div class="panel"><div class="panel-h"><h2>Review mới mỗi ngày</h2><span class="label-true">✓ Số thật từ Etsy</span></div>
    <div class="panel-b"><div class="chart sm"><canvas id="revChart" aria-label="Review mới mỗi ngày"></canvas></div></div></div>
  <div class="two">
    <div class="panel"><div class="panel-h"><h2>Listing nhiều review mới 7 ngày</h2>${csvBtn("rev")}</div>
      <div class="tw"><table><thead><tr><th></th><th>Listing</th><th>Shop</th><th class="n">+7d</th><th class="n">Tổng</th></tr></thead>
      <tbody>${top.map(l => `<tr><td style="width:44px">${l.image ? `<img loading="lazy" src="${esc(l.image)}" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:4px;display:block">` : ""}</td>
        <td style="white-space:normal;min-width:200px"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title.slice(0, 70))}${l.title.length > 70 ? "…" : ""}</a></td>

        <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Từ hay gặp: khen (màu, gỗ dày, giao nhanh) và chê (sai chính tả, cong vênh, lâu)</li>
        <li>Review 1–3 sao mới nhất của từng shop</li><li>Theme/sản phẩm được khen nhiều nhất</li></ul>
        <p class="note" style="margin:0">Dữ liệu dự kiến: <span class="mono">etsy/&lt;shop&gt;/summary.json → reviews_text[]</span></p></div></div>
  </div>` : `<div class="panel"><div class="empty"><b>Chưa có dữ liệu Etsy</b></div></div>`}`);

/* ===== 7. Lịch mùa vụ ===== */
const SEASON_VI = { christmas: "Giáng sinh", halloween: "Halloween", easter: "Phục sinh", valentine: "Valentine", "back-to-school": "Tựu trường" };
const weekStart = iso => { const t = new Date(iso + "T00:00:00Z"); const dw = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - dw); return t.toISOString().slice(0, 10); };
function vSeason(main) {
  const T = S.today;
  const NW = 16; const lastW = weekStart(T); const weeks = []; for (let i = NW - 1; i >= 0; i--) weeks.push(addDays(lastW, -7 * i));
  const inX = w => { const y = w.slice(0, 4); const a = `${y}-08-15`, b = `${y}-09-15`; return addDays(w, 6) >= a && w <= b; };
  const rows = SHOPS.map(s => { const its = ITEMS.filter(i => i.shop === s.key && i.date);
    const cells = weeks.map(w => { const xs = its.filter(i => weekStart(i.date) === w); return { n: xs.length, season: [...new Set(xs.flatMap(i => i.season || []))] }; });
    return { s, cells, total: its.length }; }).filter(r => r.total);
  const mx = Math.max(1, ...rows.flatMap(r => r.cells.map(c => c.n)));
  const seasonal = ITEMS.filter(i => (i.season || []).length).sort((a, b) => String(b.date || "0").localeCompare(String(a.date || "0")));
  section(`
  <div class="ph"><div><div class="eyebrow">Màn hình 7</div><h1>Lịch mùa vụ</h1>
    <p>Số sản phẩm mỗi shop đăng theo tuần (${NW} tuần gần nhất, tính theo ngày đăng). Chấm đỏ = tuần có hàng theo mùa. Cột tô đỏ nhạt = khung 15/8–15/9, nên đăng hàng Noel.</p></div>${csvBtn("season")}</div>
  ${rows.length ? `<div class="panel"><div class="panel-b">
    <div class="tw"><table class="hm"><thead><tr><th class="sh">Tuần bắt đầu</th>${weeks.map(w => `<th class="${inX(w) ? "xmas" : ""}" title="${inX(w) ? "Khung đăng hàng Noel" : ""}">${fmtD(w)}</th>`).join("")}<th class="sh" style="padding-left:10px">Tổng</th></tr></thead>
    <tbody>${rows.map(r => `<tr><th class="sh"><span class="shopcell"><span class="dot" style="background:${r.s.color}"></span>${esc(r.s.key)}</span></th>
      ${r.cells.map((c, k) => c.n ? `<td style="background:color-mix(in oklab,var(--seq) ${Math.round(32 + 63 * c.n / mx)}%,var(--surface));color:${c.n / mx > .45 ? "#fff" : "var(--ink)"}" data-tip="${esc(`${r.s.key} · tuần ${fmtD(weeks[k])}: ${c.n} sản phẩm${c.season.length ? " · mùa: " + c.season.map(x => SEASON_VI[x] || x).join(", ") : ""}`)}" tabindex="0">${c.n}${c.season.length ? '<span class="sz"></span>' : ""}</td>` : `<td class="z">0</td>`).join("")}
      <td class="mono" style="padding-left:10px;text-align:left">${r.total}</td></tr>`).join("")}</tbody></table></div>
    <div class="legend" style="margin-top:12px"><span>Ít</span>${[.15, .35, .6, .9].map(p => `<span class="sw" style="background:color-mix(in oklab,var(--seq) ${Math.round(32 + 63 * p)}%,var(--surface))"></span>`).join("")}<span>Nhiều (tối đa ${mx}/tuần)</span>
      <span><span class="sw" style="background:var(--crit);border-radius:50%;width:8px;height:8px"></span> có hàng mùa</span>
      <span><span class="sw" style="background:color-mix(in oklab,var(--crit) 18%,transparent)"></span> 15/8–15/9 đăng hàng Noel</span></div>
    <p class="note" style="margin:10px 0 0">Ngày đăng Shopify = published_at (shop có thể đăng lại để đẩy lên). Etsy = listed_on (Etsy làm mới khi gia hạn listing).</p></div></div>
  <div class="panel"><div class="panel-h"><h2>Sản phẩm theo mùa</h2><span class="note">${seasonal.length} mẫu gắn tag mùa</span></div>
    <div class="tw"><table><thead><tr><th>Ngày đăng</th><th>Mùa</th><th>Shop</th><th>Sản phẩm</th><th class="n">Giá</th></tr></thead>
    <tbody>${seasonal.slice(0, 40).map(i => `<tr><td class="mono">${fmtD(i.date)}</td><td>${i.season.map(x => `<span class="tag">${esc(SEASON_VI[x] || x)}</span>`).join(" ")}</td>
      <td class="dim">${esc(i.shop)}</td><td style="white-space:normal;min-width:220px"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></td><td class="n">${fmtUSD(i.price)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Chưa có sản phẩm gắn tag mùa.</td></tr>`}</tbody></table></div></div>`
  : `<div class="panel"><div class="empty"><b>Chưa có ngày đăng sản phẩm</b></div></div>`}`);
  const hw = document.querySelector(".hm")?.parentElement; if (hw) hw.scrollLeft = hw.scrollWidth;
  CSV.season = () => saveCSV("lich_mua_vu", ["shop", ...weeks], rows.map(r => [r.s.key, ...r.cells.map(c => c.n)]));
}

/* ===== Tương tác chung ===== */
const tip = $("#tip");
function showTip(el) { const t = el.getAttribute("data-tip"); if (!t) return; tip.textContent = t; tip.classList.add("on");
  const r = el.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8); let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  tip.style.left = x + "px"; tip.style.top = y + "px"; }
const hideTip = () => tip.classList.remove("on");
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); el ? showTip(el) : hideTip(); });
document.addEventListener("focusin", e => { const el = e.target.closest("[data-tip]"); el ? showTip(el) : hideTip(); });
addEventListener("scroll", hideTip, { passive: true });
document.addEventListener("click", e => {
  const c = e.target.closest("[data-csv]"); if (c && CSV[c.dataset.csv]) { CSV[c.dataset.csv](); return; }
  const sm = e.target.closest("[data-sm]"); if (sm) { LS.set("salesMode", sm.dataset.sm); render(); return; }
  const tr = e.target.closest("tr[data-shop]"); if (tr && !e.target.closest("a")) { openShop(tr.dataset.shop); return; }
  const tp = e.target.closest("[data-tip]"); if (tp && matchMedia("(hover: none)").matches) showTip(tp);
});
document.addEventListener("keydown", e => { if (e.key === "Enter") { const tr = e.target.closest?.("tr[data-shop]"); if (tr) openShop(tr.dataset.shop); } });
document.addEventListener("error", e => { const t = e.target; if (t && t.tagName === "IMG") { const ph = t.parentElement?.querySelector(".ph-img"); if (ph) { ph.hidden = false; t.remove(); } else t.style.visibility = "hidden"; } }, true);
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
let rerenderT; const rerender = () => { clearTimeout(rerenderT); rerenderT = setTimeout(() => { if (CHARTS.length) render(); }, 60); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", rerender);
new MutationObserver(rerender).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

(async function boot() {
  const md = $("#mode"); md.classList.toggle("live", DATA_MODE === "remote"); md.querySelector("span").textContent = DATA_MODE === "remote" ? "Dữ liệu trực tiếp" : "Dữ liệu SAMPLE";
  await loadAll();
  buildModel(); ITEMS = designItems();
  $("#upd").textContent = S.idx ? "Cập nhật " + fmtDT(S.idx.updated_at) + " (giờ VN)" : "Chưa có dữ liệu";
  render();
})();
</script>
