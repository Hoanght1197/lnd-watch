# Shopify nhẹ mỗi ngày 23:00 UTC (= 6:00 sáng giờ VN): /meta.json + 30 sp mới nhất cho mọi shop trong data/shops.json,
# rồi build leaderboard + alerts và commit data/. Ads FB, Etsy, SimilarWeb chạy ở máy anh Hoàng (collect/run_local.ps1).
name: shopify-daily

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: pip install -r collect/requirements.txt

      - name: Thu Shopify nhẹ (shops.json)
        # ngày dữ liệu theo giờ VN để khớp phần local chạy 6:05 sáng
        run: python collect/run_cloud.py --date "$(TZ=Asia/Ho_Chi_Minh date +%F)"

      - name: Build leaderboard + alerts
        run: python collect/build.py

      - name: Commit + push data/
        run: |
          git -c user.name=lnd-bot -c user.email=bot@users.noreply.github.com add data
          if git diff --cached --quiet; then
            echo "Không có thay đổi"
            exit 0
          fi
          DATE=$(TZ=Asia/Ho_Chi_Minh date +%F)
          git -c user.name=lnd-bot -c user.email=bot@users.noreply.github.com commit -m "data: $DATE shopify"
          # máy local có thể vừa push → rebase (file tổng hợp xung đột thì giữ bản của mình) rồi build lại
          git -c user.name=lnd-bot -c user.email=bot@users.noreply.github.com pull --rebase -X theirs
          python collect/build.py
          git -c user.name=lnd-bot -c user.email=bot@users.noreply.github.com add data
          if ! git diff --cached --quiet; then
            git -c user.name=lnd-bot -c user.email=bot@users.noreply.github.com commit -m "data: $DATE shopify (build lại sau pull)"
          fi
          git push
